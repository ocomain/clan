# ---------------------------------------------------------------------------
# Keep repository internals off the public site.
#
# publish = "." deploys the whole repo, so function source, SQL migrations,
# build scripts, the handover docs and package.json were all reachable by
# URL (and crawlable). Nothing on the site links to any of these paths —
# the functions are invoked via /.netlify/functions/ and /api/, never via
# /netlify/. force = true is required so the rule wins over the real file.
# ---------------------------------------------------------------------------
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
