# ---------------------------------------------------------------------------
# .html -> extensionless, permanently.
#
# Every canonical tag, internal link and sitemap entry has used the
# extensionless form since the May/June 2026 migration, but the .html URLs
# kept answering 200, so Google held two copies of each page and had to pick
# one on its own (it was still showing coman-heritage.html in October). A 301
# tells it which copy to keep and moves the old URL's history across.
# force = true is required because the .html file exists on disk.
#
# Deliberately NOT redirected: pages that read a query string (membership,
# gift, gift-form, gift-welcome, founder-welcome, welcome, join-chat,
# st-patricks-day) — invite and gift tokens travel in their URLs and those
# pages are noindex or transactional anyway — and everything under /members/.
# ---------------------------------------------------------------------------
