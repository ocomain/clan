[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HSTS: the site is HTTPS-only (every page already carries an
    # upgrade-insecure-requests CSP and https canonicals), so tell
    # browsers to skip the http:// round-trip for a year. Deliberately
    # no includeSubDomains / preload — subdomains aren't ours to vouch for.
    Strict-Transport-Security = "max-age=31536000"
    # No page uses the camera, microphone or geolocation (the St Patrick's
    # map is pin-your-town, not locate-me). Declaring that explicitly is
    # a Lighthouse best-practice check and blocks any injected script
    # from prompting for them.
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching for static media. Images and fonts are effectively
# immutable (a changed image gets a new filename in practice), so a
# one-year cache means repeat visitors and within-session navigation
# re-use the browser's copy instead of re-downloading multi-hundred-KB
# assets on every page. This is a sitewide performance win independent
# of format/size optimisation: the fastest image request is the one the
# browser never makes. Netlify Image CDN transforms (/.netlify/images)
# are cached separately at the edge.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

# Re-encoded homepage videos (see /videos/). Same reasoning as /images/:
# a new encode gets a new filename, so the files are immutable.
[[headers]]
  for = "/videos/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Email preview galleries are internal review tooling regenerated on every
# deploy. The generators inject <meta name="robots" noindex> into most
# files, but the gallery index pages and any future template without the
# tag would still be eligible for Google's index. An X-Robots-Tag header
# covers every response under these paths regardless of markup.
[[headers]]
  for = "/email-previews/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/email-previews-transactional/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

