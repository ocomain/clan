[build]
  publish = "."
  functions = "netlify/functions"
  # Regenerate every email preview on every deploy. Without this, the
  # previews at /email-previews/, /email-previews-transactional/, etc.
  # drift behind the source the moment an email template is edited —
  # production members get the new copy, but the review gallery still
  # shows the old version, and the gap is silent until someone notices
  # by hand. Running `npm run previews` here makes it impossible for
  # the gallery to ever lag behind a deploy: the rendered HTML files
  # are produced fresh from the same lib/ modules the Netlify
  # functions use at runtime, so what you see in /email-previews/ is
  # always exactly what the live functions will send.
  #
  # Cost: ~5-10s of build time for ~40 file renders. No external API
  # calls, no Resend hits — preview generators import builder
  # functions and render to disk.
  command = "npm install && npm run previews"

# Bundle non-code files (images, fonts) with the functions that need them.
# Without this, the runtime container won't have the shield PNG and cert
# generation fails with ENOENT. The /fonts/ directory is needed for the cert
# PDF to embed EB Garamond + Jost (matches the website typography).
[functions]
  included_files = ["netlify/functions/assets/**", "fonts/**"]

# Scheduled functions — run daily to recover abandoned applications.
# Cron is UTC. 14:00 UTC = 14:00 GMT / 15:00 BST / 15:00 IST (Ireland Standard).
# Mid-afternoon lands in a reasonable inbox window across IE/UK/EU/US-East.
[functions."daily-abandoned-sweep"]
  schedule = "0 14 * * *"

# Gift-recipient renewal reminder sweep. Offset 30min from the abandoned
# sweep so they don't compete for the function runtime. Also ~15:30 Ireland
# time - mid-afternoon reading window works just as well for this email.
[functions."daily-expiry-sweep"]
  schedule = "30 14 * * *"

# Cert publication sweep — handles day-29 publication reminder + day-30
# auto-publish for members who never explicitly published. Offset another
# 30min from expiry sweep so daily fan-out is staggered.
[functions."daily-cert-sweep"]
  schedule = "0 15 * * *"

# Gift acceptance sweep (Phase 3 — 2026-04-30) — handles two time-based
# transitions for the deferred-acceptance gift flow:
#   (A) day-30 reminder for unclaimed gifts (founder + paid)
#   (B) day-365 lapse for gifts past their 1-year hold window
# Offset 30min from the cert sweep — keeps the daily fan-out staggered
# so no two scheduled functions compete for the same runtime slot.
# 15:30 UTC = 16:30 IE/UK summer, 15:30 winter — mid-afternoon European
# inbox window for the recipient nudge.
[functions."daily-gift-acceptance-sweep"]
  schedule = "30 15 * * *"

# Council broadcast sweep — releases queued member_broadcast_sends rows
# whose release_at has passed. Two waves per broadcast:
#   - Stewards + Life Members at broadcast.start_at
#   - Everyone else at broadcast.start_at + 24h
# Runs every 15 minutes so scheduled start times honour ±15min precision.
# Per-run send LIMIT 100 keeps fan-out bounded — for a 1000-member clan
# a broadcast ships in ~2.5 hours per wave, comfortable for any
# letter that isn't time-critical to the minute.
[functions."daily-broadcast-sweep"]
  schedule = "*/15 * * * *"

# Post-signup email lifecycle sweep — dispatches the +3/+9/+18/+28/+60/+90 day
# sequence (Herald → Fergus → Linda Office × 3 → Paddy Seanchaí). Runs once per
# day, age-bucketed (each member becomes eligible for exactly one bucket on
# exactly one day). 16:00 UTC = 17:00 IE/UK summer, 16:00 winter — mid-afternoon
# European inbox window. Offset another 30min from the gift-acceptance sweep so
# the daily fan-out remains staggered.
[functions."daily-post-signup-sweep"]
  schedule = "0 16 * * *"

# PDF lead-magnet lifecycle sweep — dispatches the +3/+10/+21/+35 day
# follow-up emails (Email 1 fires synchronously on confirmation, not
# from this cron). 16:30 UTC = 17:30 IE/UK summer, 16:30 winter — same
# late-afternoon European inbox window as the post-signup sweep,
# offset 30min so the daily fan-out remains staggered.
[functions."daily-pdf-lead-sweep"]
  schedule = "30 16 * * *"

# Cart re-engagement sweep — dispatches the +10/+25/+50/+90 day follow-up
# emails for applications that have status='pending' beyond the 24h reminder.
# 15:30 UTC offsets it 90min after daily-abandoned-sweep (14:00) and 60min
# before daily-pdf-lead-sweep (16:30), keeping daily fan-out staggered.
[functions."daily-cart-reengage-sweep"]
  schedule = "30 15 * * *"

# Cert publishing functions — extended timeout to 26s (Netlify's
# synchronous max). The default is 10s. Originally this was a bandaid
# for a slow critical path that comfortably took 9-15s on cold start
# (PDF generation + storage upload + Resend publication email + gift-
# buyer keepsake + sponsor service conversion logic).
#
# As of the firePublicationSideEffects refactor, only the user-blocking
# steps remain in the awaited path: JWT verify + member fetch +
# validate + DB row update + cert PDF generation + storage upload +
# signed URL. That comfortably runs in 6-9s on cold start and 2-4s
# warm. All publication side-effects (emails, sponsor letters, title
# awards) now run fire-and-forget after the response, so they no
# longer add to the critical path.
#
# The 26s timeout STAYS as defence in depth. Removing it gains
# nothing (Netlify only bills on actual runtime) and would risk
# regression if a cold-start ever exceeded the 10s default. Keep
# until we have observability data showing the function never
# approaches 10s in practice.
[functions."submit-family-details"]
  timeout = 26

[functions."update-family-details"]
  timeout = 26

